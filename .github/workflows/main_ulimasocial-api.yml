name: Build and deploy backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/main_ulimasocial-api.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests if available
        run: npm run test --if-present

      - name: Prepare backend artifact
        run: |
          zip -r ../server-deploy.zip . \
            -x ".env" \
            -x ".env.*" \
            -x "node_modules/.cache/*"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-app
          path: server-deploy.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: server-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6291ADDBAF234373AB75C1A6C5D0175A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2A4D435ED5A140959C4AAAE0BCE2CC19 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9AEF3683B74A44108FC63A8A2412E5E0 }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "ulimasocial-api"
          slot-name: "Production"
          package: server-deploy.zip
          
